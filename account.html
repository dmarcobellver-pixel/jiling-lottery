<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>幸运大转盘 · 免费抽 Muse 账号</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf8ff;
        --bg-grad: linear-gradient(180deg, #FAF8FF 0%, #F3EFFF 100%);
        --surface: #ffffff;
        --surface-2: #f1ecfd;
        --ink: #2e2450;
        --ink-2: #6b5fa3;
        --ink-3: #9a8cc7;
        --line: #e3dbf9;
        --primary: #8b7bd8;
        --primary-deep: #6d5ac0;
        --primary-soft: #efe9fd;
        --seg-10: #ddd2fa;
        --seg-20: #c9b8f5;
        --seg-30: #b7a6f2;
        --seg-40: #a08fea;
        --seg-50: #8b7bd8;
        --seg-0: #efeafb;
        --seg-0-ink: #9a8cc7;
        --seg-ink: #3a2b66;
        --seg-ink-strong: #ffffff;
        --shadow: 0 10px 30px rgba(107, 88, 200, 0.10);
        --r-card: 20px;
        --r-btn: 14px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16122b;
          --bg-grad: linear-gradient(180deg, #1d1740 0%, #130f28 100%);
          --surface: #231c45;
          --surface-2: #2c2256;
          --ink: #f1ecff;
          --ink-2: #b6aadf;
          --ink-3: #877bb6;
          --line: #3b3068;
          --primary: #b7a6f2;
          --primary-deep: #c9b8f5;
          --primary-soft: #332a5e;
          --seg-10: #453a7d;
          --seg-20: #53448f;
          --seg-30: #6753ab;
          --seg-40: #7f6ac6;
          --seg-50: #8b7bd8;
          --seg-0: #2a2349;
          --seg-0-ink: #9a8cc7;
          --seg-ink: #ece7ff;
          --seg-ink-strong: #ffffff;
          --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg-grad);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
        min-height: 100vh;
      }
      .page {
        max-width: 480px;
        margin: 0 auto;
        padding: 28px 18px 40px;
      }

      /* ---------- 头部 ---------- */
      header { text-align: center; margin-bottom: 22px; }
      .brand {
        display: inline-block;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.14em;
        color: var(--primary);
        background: var(--primary-soft);
        padding: 5px 12px;
        border-radius: 999px;
        margin: 0 0 12px;
      }
      h1 {
        font-size: 30px;
        line-height: 1.2;
        margin: 0 0 8px;
        font-weight: 800;
        letter-spacing: 0.01em;
      }
      .sub { margin: 0; color: var(--ink-2); font-size: 15px; }
      .sub strong { color: var(--ink); font-weight: 700; }

      /* ---------- 卡片 ---------- */
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-card);
        box-shadow: var(--shadow);
      }
      .wheel-card { padding: 22px 20px; text-align: center; }

      /* ---------- 奖品条 ---------- */
      .prize-strip {
        display: flex; align-items: center; gap: 10px;
        background: var(--surface-2);
        border-radius: 12px;
        padding: 10px 14px;
        font-size: 14px; color: var(--ink-2);
        text-align: left;
      }
      .prize-strip .gift-ic { flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: var(--primary-soft); color: var(--primary); }
      .prize-strip b { color: var(--ink); font-size: 15px; }
      .prize-strip .count {
        margin-left: auto; flex: none;
        font-size: 12px; font-weight: 700; color: var(--primary);
        background: var(--primary-soft); border-radius: 999px; padding: 4px 10px;
      }

      /* ---------- 转盘 ---------- */
      .wheel-wrap {
        position: relative;
        width: min(80vw, 320px);
        aspect-ratio: 1 / 1;
        margin: 22px auto 22px;
      }
      .wheel-disc {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: var(--surface);
        border: 1px solid var(--line);
        box-shadow: 0 6px 24px rgba(107, 88, 200, 0.12);
        padding: 7px;
      }
      .wheel-svg {
        display: block; width: 100%; height: 100%;
        will-change: transform;
      }
      .wheel-svg.spinning {
        transition: transform 5.4s cubic-bezier(0.12, 0.72, 0.06, 1);
      }
      .pointer {
        position: absolute;
        top: -7px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 3;
        width: 0; height: 0;
        border-left: 13px solid transparent;
        border-right: 13px solid transparent;
        border-top: 22px solid var(--primary);
        filter: drop-shadow(0 2px 3px rgba(107, 88, 200, 0.3));
      }
      .hub {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
        width: 74px; height: 74px;
        border-radius: 50%;
        background: var(--surface);
        border: 1px solid var(--line);
        box-shadow: 0 3px 12px rgba(107, 88, 200, 0.16);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1px;
        pointer-events: none;
      }
      .hub .hub-name { font-size: 15px; font-weight: 800; color: var(--primary); letter-spacing: 0.06em; line-height: 1; }
      .hub .hub-sub { font-size: 10px; color: var(--ink-3); letter-spacing: 0.2em; line-height: 1; }

      .seg-prize { fill: var(--seg-50); }
      .seg-a { fill: var(--seg-10); }
      .seg-b { fill: var(--seg-0); }
      .seg-c { fill: var(--seg-20); }
      .lbl-prize { fill: var(--seg-ink-strong); font-weight: 800; }
      .lbl-a, .lbl-c { fill: var(--seg-ink); font-weight: 600; }
      .lbl-b { fill: var(--seg-0-ink); font-weight: 600; }

      /* ---------- 抽奖按钮 ---------- */
      .spin-btn {
        appearance: none;
        border: 0;
        width: 100%;
        max-width: 320px;
        height: 54px;
        border-radius: var(--r-btn);
        background: var(--primary);
        color: #fff;
        font: inherit;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.04em;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.1s ease, opacity 0.2s ease;
      }
      @media (prefers-color-scheme: dark) { .spin-btn { color: #17142e; } }
      .spin-btn:active { transform: scale(0.98); }
      .spin-btn:disabled { background: var(--surface-2); color: var(--ink-3); cursor: default; transform: none; }
      .once-note { margin: 12px 0 0; font-size: 13px; color: var(--ink-3); min-height: 18px; }

      /* ---------- 结果 ---------- */
      .result { display: none; margin-top: 18px; }
      .result.show { display: block; animation: rise .45s ease both; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .result-card { padding: 24px 20px; text-align: center; }
      .result-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 700;
        padding: 5px 12px;
        border-radius: 999px;
        margin-bottom: 12px;
      }
      .result-badge.win { background: var(--primary-soft); color: var(--primary); }
      .result-badge.lose { background: var(--surface-2); color: var(--ink-2); }
      .result h2 { margin: 0 0 6px; font-size: 24px; font-weight: 800; line-height: 1.25; }
      .result .who { margin: 0; font-size: 14.5px; color: var(--ink-2); line-height: 1.6; }
      .code-box {
        margin: 18px auto 6px;
        max-width: 320px;
        background: var(--surface-2);
        border: 1px dashed var(--line);
        border-radius: 12px;
        padding: 14px 10px 12px;
        text-align: center;
      }
      .code-box .code-label { font-size: 12px; letter-spacing: 0.22em; color: var(--ink-3); font-weight: 600; }
      .code-box .code {
        margin-top: 4px;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 26px; font-weight: 700; letter-spacing: 0.08em;
        color: var(--primary);
        user-select: all;
      }
      .claim-steps {
        margin: 16px auto 0; max-width: 320px;
        text-align: left;
        font-size: 14px; line-height: 1.75; color: var(--ink-2);
        background: var(--surface-2); border-radius: 12px;
        padding: 12px 16px;
      }
      .claim-steps b { color: var(--ink); }
      .claim-steps .n {
        display: inline-grid; place-items: center;
        width: 18px; height: 18px; margin-right: 7px;
        border-radius: 50%; background: var(--primary); color: #fff;
        font-size: 11px; font-weight: 800; vertical-align: 2px;
      }
      @media (prefers-color-scheme: dark) { .claim-steps .n { color: #17142e; } }
      .lose-msg { margin: 4px auto 0; max-width: 300px; font-size: 14.5px; line-height: 1.75; color: var(--ink-2); }
      .lose-seg {
        display: inline-block; margin-top: 14px;
        font-size: 13px; font-weight: 700; color: var(--primary);
        background: var(--primary-soft); border-radius: 999px; padding: 6px 14px;
      }

      .code-box + .code-box { margin-top: 10px; }

      /* ---------- 抽奖记录 ---------- */
      .history-title { margin: 0 0 10px; font-size: 18px; font-weight: 800; }
      .history-list { list-style: none; margin: 0 auto; padding: 0; max-width: 320px; text-align: left; }
      .history-list li {
        display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
        padding: 8px 2px;
        border-bottom: 1px dashed var(--line);
        font-size: 14px; color: var(--ink-2);
      }
      .history-list li:last-child { border-bottom: 0; }
      .history-list .h-code {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-weight: 700; color: var(--primary); white-space: nowrap;
      }

      /* ---------- 规则 ---------- */
      footer {
        text-align: center;
        margin-top: 26px;
        font-size: 12.5px; line-height: 1.9; color: var(--ink-3);
      }
      footer .rule-line { display: block; }
      footer .sep { margin: 0 6px; color: var(--line); }

      #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }

      /* ---------- 链接无效提示 ---------- */
      .gate-card { padding: 30px 22px; text-align: center; }
      .gate-card[hidden] { display: none; }
      .gate-ic {
        display: grid; place-items: center;
        width: 54px; height: 54px; margin: 0 auto 14px;
        border-radius: 50%;
        background: var(--primary-soft); color: var(--primary);
      }
      .gate-card h2 { margin: 0 0 8px; font-size: 22px; font-weight: 800; }
      .gate-card p { margin: 0; font-size: 14.5px; line-height: 1.8; color: var(--ink-2); }

      @media (prefers-reduced-motion: reduce) {
        .wheel-svg.spinning { transition-duration: 0.6s; }
        .result.show { animation: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="confetti" aria-hidden="true"></canvas>
    <main class="page">
      <header>
        <p class="brand">朋友圈福利</p>
        <h1 id="pageTitle">幸运大转盘</h1>
        <p class="sub">免费抽 <strong>Meta Muse 账号</strong> · 共 5 个</p>
      </header>

      <section class="card gate-card" id="gateCard" hidden>
        <span class="gate-ic" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </span>
        <h2>链接无效</h2>
        <p>请用店主发的专属链接打开本页。<br />没有专属链接的话，先找店主领取，拿到链接后再来抽奖。</p>
      </section>

      <section class="card wheel-card" id="wheelCard" aria-label="抽奖转盘">
        <div class="prize-strip">
          <span class="gift-ic" aria-hidden="true">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4"/><path d="M5 12v9h14v-9"/><path d="M12 8v13"/><path d="M12 8s-4.5.2-6-1.2C4.6 5.4 5.6 3 8 3c2.8 0 4 5 4 5Zm0 0s4.5.2 6-1.2C19.4 5.4 18.4 3 16 3c-2.8 0-4 5-4 5Z"/></svg>
          </span>
          <span>今日奖品：<b>Muse 账号</b></span>
          <span class="count">共 5 个</span>
        </div>

        <div class="wheel-wrap">
          <div class="pointer" aria-hidden="true"></div>
          <div class="wheel-disc">
            <svg class="wheel-svg" id="wheelSvg" viewBox="0 0 360 360" role="img" aria-label="八格抽奖转盘，其中一格是 Muse 账号"></svg>
          </div>
          <div class="hub" aria-hidden="true">
            <span class="hub-name">MUSE</span>
            <span class="hub-sub">账号抽奖</span>
          </div>
        </div>

        <button class="spin-btn" id="spinBtn" type="button">开始抽奖</button>
        <p class="once-note" id="wheelNote">凭专属链接参加，次数以票面为准</p>
      </section>

      <section class="result" id="resultWin" aria-live="polite">
        <div class="card result-card">
          <span class="result-badge win">恭喜中奖</span>
          <h2>恭喜你，中奖啦！</h2>
          <p class="who" id="winWho"></p>
          <div id="winCodes"></div>
          <div class="claim-steps">
            <div><span class="n">1</span><b>截图本页</b>，把中奖结果拍下来</div>
            <div><span class="n">2</span>回到微信，<b>私聊我领奖</b></div>
            <div><span class="n">3</span>截图和<b>中奖码一起发</b>，核对无误就发账号</div>
          </div>
        </div>
      </section>

      <section class="result" id="resultLose" aria-live="polite">
        <div class="card result-card">
          <span class="result-badge lose">谢谢参与</span>
          <h2>就差一点点</h2>
          <p class="lose-msg" id="loseMsg">这次没能抽中，谢谢你的参与。<br />没关系，好运正在路上，下次活动见啦。</p>
          <span class="lose-seg" id="loseSeg"></span>
        </div>
      </section>

      <section class="result" id="historyCard" aria-live="polite">
        <div class="card result-card">
          <h2 class="history-title">我的抽奖记录</h2>
          <ul class="history-list" id="historyList"></ul>
        </div>
      </section>

      <footer>
        <span class="rule-line">次数以票面为准<span class="sep">·</span>中奖以本页中奖码截图为准</span>
        <span class="rule-line">奖品共 5 个，先到先得，送完即止</span>
      </footer>
    </main>

        function setWheelRotation(deg, animate) {
          if (animate) {
            svg.classList.add("spinning");
          } else {
            svg.classList.remove("spinning");
          }
          currentRotation = deg;
          svg.style.transform = "rotate(" + deg + "deg)";
        }

        function escapeHtml(s) {
          return String(s).replace(/[&<>"']/g, function (m) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
          });
        }

        /* 中奖区：这张票中过的每一个码都列出来，互不覆盖 */
        function renderWinCodes() {
          var box = document.getElementById("winCodes");
          box.innerHTML = "";
          record.history.forEach(function (h) {
            if (!h.win) { return; }
            var div = document.createElement("div");
            div.className = "code-box";
            var label = document.createElement("div");
            label.className = "code-label";
            label.textContent = "你的中奖码";
            var code = document.createElement("div");
            code.className = "code";
            code.textContent = h.code;
            div.appendChild(label);
            div.appendChild(code);
            box.appendChild(div);
          });
        }
        function showWin() {
          document.getElementById("winWho").innerHTML =
            "运气爆棚，<br />Muse 账号就是你的啦！";
          renderWinCodes();
          resultWin.classList.add("show");
        }
        function showLose(entry) {
          var line = LOSE_LINES[entry.label] || LOSE_LINES["谢谢参与"];
          document.getElementById("loseMsg").innerHTML =
            escapeHtml(line).replace(/\n/g, "<br />");
          document.getElementById("loseSeg").textContent = "转盘停在：「" + entry.label + "」";
          resultLose.classList.add("show");
        }

        /* 抽奖记录：每一次的结果都留档，中奖带码、未中带落点 */
        function renderHistory() {
          if (!record || record.history.length === 0) {
            historyCard.classList.remove("show");
            return;
          }
          historyList.innerHTML = "";
          record.history.forEach(function (h, i) {
            var li = document.createElement("li");
            var left = document.createElement("span");
            left.textContent = "第 " + (i + 1) + " 次";
            var right = document.createElement("span");
            if (h.win) {
              right.className = "h-code";
              right.textContent = "中奖 " + h.code;
            } else {
              right.textContent = h.label;
            }
            li.appendChild(left);
            li.appendChild(right);
            historyList.appendChild(li);
          });
          historyCard.classList.add("show");
        }

        function refreshUi(positionWheel) {
          if (!ticketValid || !record) { return; }
          var remaining = remainingOf(record);
          var last = record.history[record.history.length - 1];
          var hasWin = false;
          record.history.forEach(function (h) { if (h.win) { hasWin = true; } });

          if (last && positionWheel) {
            var midAngle = last.segIndex * 45 + 22.5;
            setWheelRotation((360 - midAngle) % 360, false);
          }
          if (hasWin) { showWin(); } else { resultWin.classList.remove("show"); }
          if (last && !last.win) { showLose(last); } else { resultLose.classList.remove("show"); }
          renderHistory();

          if (remaining > 0) {
            spinBtn.disabled = false;
            spinBtn.textContent = "开始抽奖";
            note.textContent = "剩余 " + remaining + " 次 · 这张票共可抽 " + ticketTotal + " 次";
          } else {
            spinBtn.disabled = true;
            spinBtn.textContent = "次数已用完";
            note.textContent = "这张票的次数已经用完啦，全部结果都在下面";
          }
        }

        /* ============ 票码无效：提示并锁住转盘 ============ */
        if (!ticketValid) {
          document.getElementById("gateCard").hidden = false;
          document.getElementById("wheelCard").style.display = "none";
          spinBtn.disabled = true;
        }

        /* ============ 进页面先按存档恢复：剩余次数、上次结果、全部记录 ============ */
        if (ticketValid) { refreshUi(true); }

        /* ============ 抽奖：先扣次数、先定结果存档，再转转盘 ============ */
        spinBtn.addEventListener("click", function () {
          if (spinning || !ticketValid || !record) { return; }
          if (remainingOf(record) <= 0) { return; }

          // 中奖概率 6.6%：先按概率定输赢，再落到对应格子（中奖落奖品格，未中奖在其余 7 格里随机）
          var segIndex;
          if (Math.random() < 0.066) {
            segIndex = 0;
          } else {
            segIndex = 1 + Math.floor(Math.random() * (SEGMENTS.length - 1));
          }
          var seg = SEGMENTS[segIndex];

          // 先扣次数：结果当场追加进存档，转盘还没停也算数
          var entry = {
            segIndex: segIndex,
            label: seg.label,
            win: !!seg.prize,
            code: seg.prize ? makeCode() : null,
            ts: Date.now()
          };
          record.history.push(entry);
          record.total = ticketTotal;
          saveRecord(record);

          spinning = true;
          spinBtn.disabled = true;
          spinBtn.textContent = "转动中…";
          note.textContent = "转盘转动中，好运马上就来…";

          var mid = segIndex * 45 + 22.5;
          var jitter = (Math.random() * 26 - 13); // 格内 ±13°，不压线
          var finalOffset = (((360 - mid + jitter) % 360) + 360) % 360;
          var curMod = ((currentRotation % 360) + 360) % 360;
          var delta = (((finalOffset - curMod) % 360) + 360) % 360;
          var target = currentRotation + 360 * 6 + delta;
          setWheelRotation(target, true);

          var finish = function () {
            spinning = false;
            refreshUi(false);
            if (entry.win) { launchConfetti(); }
            var targetEl = entry.win ? resultWin : resultLose;
            setTimeout(function () {
              targetEl.scrollIntoView({ behavior: "smooth", block: "center" });
            }, 60);
          };
          var done = false;
          var onEnd = function (ev) {
            if (done || (ev && ev.propertyName && ev.propertyName !== "transform")) { return; }
            done = true;
            svg.removeEventListener("transitionend", onEnd);
            finish();
          };
          svg.addEventListener("transitionend", onEnd);
          setTimeout(onEnd, 6200); // 兜底：过渡事件丢失时也能出结果
        });

        /* ============ 中奖撒花（克制版，主题色小彩片） ============ */
        function launchConfetti() {
          if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) { return; }
          var canvas = document.getElementById("confetti");
          var ctx = canvas.getContext("2d");
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
          var colors = ["#8b7bd8", "#b7a6f2", "#c9b8f5", "#ddd2fa", "#e7c46b", "#f4b8d0"];
          var pieces = [];
          for (var i = 0; i < 90; i++) {
            pieces.push({
              x: Math.random() * canvas.width,
              y: -20 - Math.random() * canvas.height * 0.35,
              w: 5 + Math.random() * 5,
              h: 8 + Math.random() * 6,
              vy: 1.6 + Math.random() * 2.4,
              vx: -0.8 + Math.random() * 1.6,
              rot: Math.random() * Math.PI,
              vr: -0.06 + Math.random() * 0.12,
              color: colors[i % colors.length]
            });
          }
          var start = null;
          function frame(t) {
            if (!start) { start = t; }
            var elapsed = t - start;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            var alive = false;
            pieces.forEach(function (p) {
              p.y += p.vy; p.x += p.vx + Math.sin((elapsed / 300) + p.rot) * 0.5; p.rot += p.vr;
              if (p.y < canvas.height + 30) { alive = true; }
              ctx.save();
              ctx.translate(p.x, p.y);
              ctx.rotate(p.rot);
              ctx.globalAlpha = Math.max(0, 1 - Math.max(0, elapsed - 2600) / 900);
              ctx.fillStyle = p.color;
              ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
              ctx.restore();
            });
            if (alive && elapsed < 3600) {
              requestAnimationFrame(frame);
            } else {
              ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
          }
          requestAnimationFrame(frame);
        }
      })();
    </script>
  </body>
</html>
